<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — ArticleSummary</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  <style>
    .auth-container { flex: 1; display: flex; justify-content: center; align-items: center; padding: 20px; }
    .auth-card { background: #161b27; border: 1px solid #1e2a3a; border-radius: 16px; padding: 32px; width: 100%; max-width: 400px; }
    .auth-title { font-size: 20px; font-weight: 700; color: #f1f5f9; margin-bottom: 24px; text-align: center; }
    .form-group { margin-bottom: 16px; }
    .form-label { display: block; font-size: 13px; color: #94a3b8; margin-bottom: 6px; }
    .form-input { width: 100%; background: #0f1117; border: 1px solid #2d3748; border-radius: 8px; padding: 10px 14px; color: #e2e8f0; font-size: 14px; outline: none; }
    .form-input:focus { border-color: #6366f1; }
    .auth-btn { width: 100%; margin-top: 8px; }
    .auth-footer { margin-top: 20px; text-align: center; font-size: 13px; color: #64748b; }
    .auth-link { color: #818cf8; text-decoration: none; font-weight: 600; }
    .auth-link:hover { text-decoration: underline; }
    .error-msg { background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.2); color: #f87171; padding: 10px; border-radius: 8px; font-size: 13px; margin-bottom: 16px; }
  </style>
</head>
<body>
  <header>
    <span class="logo">ArticleSummary</span>
  </header>
  <div class="auth-container">
    <div class="auth-card">
      <h2 class="auth-title">Welcome Back</h2>
      {% if form.errors %}
        <div class="error-msg">Invalid username or password.</div>
      {% endif %}
      <form method="POST">
        {% csrf_token %}
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" name="username" class="form-input" required autofocus />
        </div>
        <div class="form-group">
          <label class="form-label">Password</label>
          <input type="password" name="password" class="form-input" required />
        </div>
        <button type="submit" class="btn btn-primary auth-btn">Log In</button>
      </form>
      <div class="auth-footer">
        Don't have an account? <a href="{% url 'signup' %}" class="auth-link">Sign Up</a>
      </div>
    </div>
  </div>
</body>
</html>
